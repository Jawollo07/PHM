name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phm
          POSTGRES_USER: phm
          POSTGRES_PASSWORD: phm-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phm -d phm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://phm:phm-ci-password@localhost:5432/phm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend
      - name: Test wallet domain
        run: pytest -q
      - name: Verify database migrations
        run: alembic upgrade head

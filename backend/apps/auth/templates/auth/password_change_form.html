<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PHM – Passwort ändern</title></head>
<body><main><h1>Passwort ändern</h1>
<p>Dein neues Passwort wird zuerst mit deinem verknüpften Pelican-Konto synchronisiert. Nur wenn das gelingt, wird es auch in PHM gespeichert.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Passwort ändern</button></form>
<a href="{% url 'account' %}">Zurück zum Konto</a>
</main></body></html>

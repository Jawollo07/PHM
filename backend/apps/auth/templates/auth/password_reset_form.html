<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PHM – Passwort zurücksetzen</title></head>
<body><main><h1>Passwort zurücksetzen</h1><p>Gib die E-Mail-Adresse deines bestätigten PHM-Kontos ein. Wir senden dir gegebenenfalls einen sicheren Link.</p>
<form method="post">{% csrf_token %}{{ form.email.label_tag }} {{ form.email }} {{ form.email.errors }}<button type="submit">Link anfordern</button></form>
<p><a href="{% url 'auth' %}">Zur Anmeldung</a></p></main></body></html>

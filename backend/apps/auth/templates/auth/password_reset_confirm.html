<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PHM – Neues Passwort</title></head>
<body><main><h1>Neues Passwort festlegen</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Passwort speichern</button></form>
{% else %}<p role="alert">Der Link ist ungültig oder abgelaufen. Bitte fordere einen neuen Link an.</p><a href="{% url 'password_reset' %}">Neuen Link anfordern</a>{% endif %}
</main></body></html>

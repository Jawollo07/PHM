<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PHM – Konto erstellen</title>
</head>
<body>
    <main>
        <h1>Privates Konto erstellen</h1>
        <p>PHM-Konten sind ausschließlich für private Kunden vorgesehen.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <p>
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </p>
            {% endfor %}
            <button type="submit">Konto erstellen</button>
        </form>
        <p><a href="{% url 'auth' %}">Zur Anmeldung</a></p>
    </main>
</body>
</html>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phm
      POSTGRES_USER: phm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - phm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phm -d phm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://phm:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/phm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  phm-postgres:
